server:
  port: 8085
spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost} 
      port: ${REDIS_PORT:6379}
logging:
  level:
    com.onfis: DEBUG
app:
  jwt:
    secret: ${JWT_SECRET}
  services:
    user: ${USER_SERVICE_URL:http://onfis-user-service:8081}
    announcement: ${ANNOUNCEMENT_SERVICE_URL:http://onfis-announcement-service:8086}
    project: ${PROJECT_SERVICE_URL:http://project-service:8082}
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    max-output-tokens: 4096
  bot:
    user-id: ${BOT_USER_ID:00000000-0000-0000-0000-000000000b07}
livekit:
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  url: ${LIVEKIT_URL}
